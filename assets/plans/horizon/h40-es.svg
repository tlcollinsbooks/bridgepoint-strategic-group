nt-family="Arial,sans-serif" font-size="12" fill="#849089" text-anchor="start">FRENTE</text><path d="M271 210L1201 210" fill="none" stroke="#abb3aa" stroke-width="1"/><path d="M271 204L271 216" fill="none" stroke="#abb3aa" stroke-width="1"/><path d="M1201 204L1201 216" fill="none" stroke="#abb3aa" stroke-width="1"/><text x="736" y="200" font-family="Arial,sans-serif" font-size="15" fill="#63716c" text-anchor="middle">Contenedor de 40 pies</text><path d="M80 618L1400 618" fill="none" stroke="#c9c9b8" stroke-width="1"/><text x="80" y="663" font-family="Arial,sans-serif" font-size="17" fill="#263b39" text-anchor="start">1  Cuarto técnico y almacén</text><text x="80" y="688" font-family="Arial,sans-serif" font-size="14" fill="#63716c" text-anchor="start">Acceso exterior. Sin lavandería.</text><text x="415" y="663" font-family="Arial,sans-serif" font-size="17" fill="#263b39" text-anchor="start">2  Dormitorio</text><text x="415" y="688" font-family="Arial,sans-serif" font-size="14" fill="#63716c" text-anchor="start">Mobiliario ilustrativo.</text><text x="750" y="663" font-family="Arial,sans-serif" font-size="17" fill="#263b39" text-anchor="start">3  Baño</text><text x="750" y="688" font-family="Arial,sans-serif" font-size="14" fill="#63716c" text-anchor="start">Distribución propuesta.</text><text x="1085" y="663" font-family="Arial,sans-serif" font-size="17" fill="#263b39" text-anchor="start">4  Cocina</text><text x="1085" y="688" font-family="Arial,sans-serif" font-size="14" fill="#63716c" text-anchor="start">Muebles lineales ilustrativos.</text><text x="80" y="740" font-family="Arial,sans-serif" font-size="17" fill="#263b39" text-anchor="start">5  Sala</text><text x="80" y="765" font-family="Arial,sans-serif" font-size="14" fill="#63716c" text-anchor="start">Asientos y acceso al patio.</text><text x="415" y="740" font-family="Arial,sans-serif" font-size="17" fill="#263b39" text-anchor="start">6  Patio lateral</text><text x="415" y="765" font-family="Arial,sans-serif" font-size="14" fill="#63716c" text-anchor="start">Conectado a la terraza frontal.</text><text x="750" y="740" font-family="Arial,sans-serif" font-size="17" fill="#263b39" text-anchor="start">7  Terraza cubierta</text><text x="750" y="765" font-family="Arial,sans-serif" font-size="14" fill="#63716c" text-anchor="start">Comedor y asientos exteriores.</text><text x="80" y="836" font-family="Arial,sans-serif" font-size="15" fill="#263b39" text-anchor="start">DISEÑO PROPUESTO · No es un plano constructivo · Sin escala</text><text x="80" y="862" font-family="Arial,sans-serif" font-size="14" fill="#63716c" text-anchor="start">Se conserva la distribución original. Mobiliario, accesorios y acabados ilustrativos, sujetos a revisión visual.</text><text x="80" y="884" font-family="Arial,sans-serif" font-size="14" fill="#63716c" text-anchor="start">Equipos, ventilación, aperturas y dimensiones requieren coordinación técnica. No se indican superficies totales.</text></svg>